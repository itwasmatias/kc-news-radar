[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kc-news-radar"
version = "0.1.0"
description = "Kansas City News Radar — experimental early-warning system for local journalism"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kansas City News Radar contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "brotli>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kc-news-radar-collect = "kc_news_radar.collect:main"
kc-news-radar-serve = "kc_news_radar.app:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kc_news_radar" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
